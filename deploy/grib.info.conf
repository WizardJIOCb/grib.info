server {
    listen 80;
    listen [::]:80;
    server_name grib.info www.grib.info;
    root /var/www/grib.info/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    access_log /var/log/nginx/grib.info.access.log;
    error_log /var/log/nginx/grib.info.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location ~ /\. { deny all; }
    location ~* ^/(reference|deploy|server|storage|node_modules|secrets|package|build-catalog) { return 404; }
    location ~* \.(ttf|jpg|svg|css|js)$ { expires 1h; try_files $uri =404; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
